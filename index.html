<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rising Sun Solar Systems - Under Construction</title>
    <meta property="og:title" content="Rising Sun Solar Systems">
    <meta property="og:description" content="Powering Tomorrow with Clean Energy">
    <meta property="og:image" content="http://risingsunsolar.in/assets/logo.png">
    <meta property="og:url" content="http://www.risingsunsolar.in/">
    <meta property="og:type" content="website">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 193, 7, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 152, 0, 0.02) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            position: relative;
            z-index: 1;
        }

        .logo {
            margin-bottom: 2rem;
            color: #ff9800;
            animation: fadeIn 1s ease-in;
        }
        .logo > img {
            width: 20rem;
            margin: 10px auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
            animation: slideUp 0.8s ease-out;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 3rem;
            animation: slideUp 1s ease-out;
        }

        .divider {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff9800, transparent);
            margin: 2rem auto;
            animation: fadeIn 1.2s ease-in;
        }

        .status {
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            margin: 2.5rem 0;
            animation: fadeIn 1.5s ease-in;
        }

        .message {
            font-size: 1rem;
            font-weight: 300;
            color: #666;
            margin: 2rem 0;
            line-height: 1.8;
            animation: fadeIn 1.8s ease-in;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 3.5rem;
            animation: fadeIn 2s ease-in;
        }

        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border: 1px solid #e0e0e0;
            border-radius: 50%;
            color: #666;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .social-links a:hover {
            border-color: #ff9800;
            color: #ff9800;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            .tagline {
                font-size: 0.9rem;
                letter-spacing: 1.5px;
            }

            .status {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }

            .social-links {
                gap: 1.5rem;
            }

            .social-links a {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .logo {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="assets/logo.png">
        </div>
        
        <h1>RISING SUN SOLAR SYSTEMS</h1>
        <p class="tagline">Powering Tomorrow with Clean Energy</p>
        
        <div class="divider"></div>
        
        <p class="status">Site Under Construction</p>
        
        <p class="message">
            We're crafting something exceptional.<br>
            Our new digital presence will be with you soon.
        </p>
        
        <div class="social-links">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://wa.me/" target="_blank" aria-label="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>
</body>
</html>
